# The checker in CI (README.md, "How a recipe gets in"): every recipe against the schema, its
# fixtures and the catalog rules, plus a dry run of the index builder. A pull request from a branch of
# this repo that only touches recipes/, fixtures/ or revoked.txt is squash-merged when it passes, and
# the signed publish runs in the same workflow run (a GITHUB_TOKEN merge starts no push run).
# Drafted recipes never merge themselves (README, "Drafted recipes wait for the owner"): a pull
# request from a draft/* branch, or one with a recipe whose status is "learned", whose notes say a
# model touched it ("by AI", what the intake's drafting job writes), or a fixture whose source is
# "learned", waits for the owner's merge.
name: check

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by publish.yml

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: checker/*.gradle.kts

      - name: Check the catalog
        run: ./checker/gradlew -p checker check --no-daemon

      - name: Index dry run (unsigned)
        run: python3 tools/build_index.py --out "$RUNNER_TEMP/site"

  automerge:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Only catalog files changed?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          printf '%s\n' "$files"
          other="$(printf '%s\n' "$files" | grep -vE '^(recipes/[^/]+\.json|fixtures/[^/]+/[^/]+\.json|revoked\.txt)$' || true)"
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not auto-merged: the pull request changes files outside recipes/, fixtures/ and revoked.txt."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Drafted? Then it waits for the owner
        id: drafted
        if: steps.scope.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          why=""
          case "$HEAD_REF" in draft/*) why="it comes from a draft/ branch" ;; esac
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename')"
          while IFS= read -r f; do
            [ -n "$why" ] && break
            [ -f "$f" ] || continue
            case "$f" in
              recipes/*.json)
                if jq -e '(.meta.status // "") == "learned" or ((.meta.notes // "") | test("\\bby AI\\b"))' "$f" >/dev/null 2>&1; then
                  why="$f was learned or touched by a model"
                fi ;;
              fixtures/*.json)
                if jq -e '(.source // "") == "learned"' "$f" >/dev/null 2>&1; then why="$f holds learned shapes"; fi ;;
            esac
          done <<< "$files"
          if [ -n "$why" ]; then
            echo "::notice::Not auto-merged: a drafted recipe waits for the owner's merge ($why)."
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge
        id: merge
        if: steps.scope.outputs.ok == 'true' && steps.drafted.outputs.held == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The merge commit's author is the Actions bot's noreply address, never an account's own email.
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" --delete-branch \
            --author-email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "merged=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: main
    secrets:
      EXCHANGE_SIGNING_KEY: ${{ secrets.EXCHANGE_SIGNING_KEY }}
